server:
  port: 8080

spring:
  application:
    name: spring-ai-board-step6

  datasource:
    url: jdbc:h2:file:./data/boarddb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: board
    password: board

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      # OpenAI 외의 호환 게이트웨이(OpenRouter 등)를 쓸 때만 OPENAI_BASE_URL을 지정합니다.
      # 예) export OPENAI_BASE_URL=https://openrouter.ai/api  (뒤에 /v1은 붙이지 않습니다)
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          # gpt-5.6 세대의 경량 모델입니다. 컨텍스트 105만 토큰,
          # Tool Calling과 Structured Output을 모두 지원하며 $0.10 / $0.60(100만 토큰당)입니다.
          # 상위가 필요하면 gpt-5.6-terra($1.00 / $6.00)로 올립니다.
          model: gpt-5.6-luna
          temperature: 0.0

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

logging:
  level:
    org.springframework.ai: INFO
    com.frentis.board: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

board:
  rag:
    policies-path: ./data/policies
    persist-path: ./data/vector-store.json
